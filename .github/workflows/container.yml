name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - pyproject.toml
      - src/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish
        required: true
        default: 0.9.14
      publish:
        description: Push the multi-architecture image to GHCR and Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read


concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Container smoke gate
    if: github.event_name == 'pull_request' || inputs.publish == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # buildx, so the build below can read the registry layer cache. Plain
      # `docker build` cannot.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Single source of truth: [project] version in pyproject.toml. The Dockerfile
      # COPYs dist/breachsafe_qureddy-<version>-*.whl and its ARG QUREDDY_VERSION.
      # The workflow still resolves the version from package metadata so manual
      # dispatches cannot publish an image with a mismatched package version.
      # Export via $GITHUB_ENV (not inline ${{ }}) so it can't break out of the shell.
      - name: Resolve version from pyproject.toml
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          test -n "$VERSION" || { echo "ERROR: could not read version from pyproject.toml" >&2; exit 1; }
          echo "QUREDDY_VERSION=$VERSION" >> "$GITHUB_ENV"
      # The image builds its own wheel from source in an in-image stage (#253),
      # so no host `python -m build` prestep is needed.
      - name: Build image
        run: |
          # Read the publish job's registry layer cache so a PR reuses layers instead
          # of rebuilding from the base every time. Read-only and unauthenticated: the
          # package is public, and a fork PR has no ghcr write credential. A cache miss
          # is not an error.
          docker buildx build \
            --build-arg "QUREDDY_VERSION=${QUREDDY_VERSION}" \
            --cache-from "type=registry,ref=ghcr.io/breachsafe/qureddy:buildcache-amd64" \
            --load \
            --tag qureddy-container:smoke .
      - name: Verify version banner
        run: |
          set -euo pipefail
          docker run --rm qureddy-container:smoke --version \
            | grep -F "BreachSAFE QuReddy ${QUREDDY_VERSION}"
      - name: Verify runtime identity and capability
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint sh qureddy-container:smoke -c 'id -u')" = "1000"
          docker run --rm --entrypoint sh qureddy-container:smoke -c \
            'set -eu
             /opt/openssl/bin/openssl version | grep -q "^OpenSSL 3\\.5\\.8 "
             /opt/openssl/bin/openssl list -tls1_3 -tls-groups | grep -q X25519MLKEM768
             /opt/openssl-legacy/bin/openssl version | grep -q "^OpenSSL 1\\.0\\.2u "
             /opt/openssl-legacy/bin/openssl ciphers | tr ":" "\\n" | grep -qx RC4-SHA'
          expected="$(docker inspect qureddy-container:smoke \
            --format '{{ index .Config.Labels "io.breachsafe.qureddy.ike-scan.version" }}')"
          actual="$(docker run --rm --entrypoint dpkg-query qureddy-container:smoke \
            -W -f='${Version}' ike-scan)"
          test "$actual" = "$expected"
          docker run --rm --entrypoint ike-scan qureddy-container:smoke --version
          docker run --rm --entrypoint sh qureddy-container:smoke -c \
            'test -r /usr/share/doc/ike-scan/copyright'
      - name: Verify TLS CBOM and streams
        run: |
          set -euo pipefail
          docker run --rm qureddy-container:smoke scan tls pq.cloudflareresearch.com --format cbom > cbom.json 2> cbom.err
          test ! -s cbom.err
          python -c 'import json; d=json.load(open("cbom.json")); assert d["specVersion"] == "1.7"; assert d["components"]'
          docker run --rm qureddy-container:smoke scan tls pq.cloudflareresearch.com --format cbom > combined.json 2>&1
          python -c 'import json; json.load(open("combined.json"))'
      - name: Verify JSON, rich, SSH, IP/SNI, and expected failure
        run: |
          set -euo pipefail
          docker run --rm qureddy-container:smoke scan tls example.com --format json > tls.json
          python -c 'import json; json.load(open("tls.json"))'
          docker run --rm qureddy-container:smoke scan tls 1.1.1.1:443 --sni one.one.one.one > ip.txt
          docker run --rm qureddy-container:smoke scan ssh github.com --format cbom > ssh.json
          python -c 'import json; d=json.load(open("ssh.json")); assert d["specVersion"] == "1.7"'
          set +e
          docker run --rm qureddy-container:smoke scan tls badssl.com --format json > badssl.json
          rc=$?
          set -e
          test "$rc" = 2

  # Resolve the image version once, from the release tag on a `release` event
  # (strip the leading `v` from `vX.Y.Z`) or from the dispatch input otherwise.
  # Inputs pass through env (not inline ${{ }}) for script-injection hardening.
  version:
    name: Resolve image version
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${TAG#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Build each architecture on its OWN NATIVE runner (no QEMU emulation: emulating an
  # arm64 OpenSSL-from-source build hangs 30+ min). Each job pushes by digest; the
  # `manifest` job stitches them into the multi-arch tags.
  publish:
    name: Build ${{ matrix.arch }} image
    needs: version
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build release wheel (pure-python; Dockerfile COPYs dist/*.whl)
        run: uv tool run --from "build==1.3.0" python -m build --wheel
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build + push ${{ matrix.arch }} by digest (native, no emulation)
        id: build
        env:
          # Pass the resolved version through env, not inline ${{ }}, so it cannot break
          # out of the shell command (script-injection hardening).
          QUREDDY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "QUREDDY_VERSION=${QUREDDY_VERSION}" \
            --provenance=true --sbom=true \
            --cache-from "type=registry,ref=ghcr.io/breachsafe/qureddy:buildcache-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=ghcr.io/breachsafe/qureddy:buildcache-${{ matrix.arch }},mode=max" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --output "type=image,name=ghcr.io/breachsafe/qureddy,push-by-digest=true,name-canonical=true,push=true" \
            .
          digest="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/meta.json'))['containerimage.digest'])")"
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$digest" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}

  manifest:
    name: Merge multi-arch manifest
    needs: [version, publish]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Create + push staged multi-arch manifest
        # Version passes through env (not inline ${{ }}) for script-injection hardening.
        env:
          QUREDDY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          refs=""
          for f in digests/*; do refs="$refs ghcr.io/breachsafe/qureddy@$(cat "$f")"; done
          # Keep mutable release tags untouched until the digest is signed and verified.
          # shellcheck disable=SC2086 # refs intentionally expands to multiple image refs.
          docker buildx imagetools create --tag "ghcr.io/breachsafe/qureddy:sha-${GITHUB_SHA::12}" $refs
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the staged image digest
        env:
          QUREDDY_VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ghcr.io/breachsafe/qureddy
        run: |
          set -euo pipefail
          raw_manifest="$(docker buildx imagetools inspect --raw "$IMAGE:sha-${GITHUB_SHA::12}")"
          digest="sha256:$(printf '%s' "$raw_manifest" | sha256sum | cut -d' ' -f1)"
          test -n "$digest" && case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          cosign sign --yes "$IMAGE@$digest"
          scripts/verify_container_signature.sh "$IMAGE@$digest"
          docker buildx imagetools inspect "$IMAGE@$digest"
      - name: Promote verified digest to release tags
        env:
          QUREDDY_VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ghcr.io/breachsafe/qureddy
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect --raw "$IMAGE:sha-${GITHUB_SHA::12}" \
            | sha256sum | cut -d' ' -f1)"
          digest="sha256:${digest}"
          for tag in "$QUREDDY_VERSION" latest; do
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$digest"
            scripts/verify_container_signature.sh "$IMAGE:$tag"
          done
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || { echo 'DOCKERHUB_USERNAME is not configured' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'DOCKERHUB_TOKEN is not configured' >&2; exit 1; }
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Promote the signed digest to Docker Hub
        env:
          QUREDDY_VERSION: ${{ needs.version.outputs.version }}
          SOURCE_IMAGE: ghcr.io/breachsafe/qureddy
          DEST_IMAGE: docker.io/breachsafe/qureddy
        run: |
          set -euo pipefail
          digest="sha256:$(docker buildx imagetools inspect --raw "$SOURCE_IMAGE:sha-${GITHUB_SHA::12}" | sha256sum | cut -d' ' -f1)"
          # Copy the already-built manifest to an immutable staging tag. Sign and
          # verify that destination digest before moving either mutable release tag.
          docker buildx imagetools create \
            --tag "$DEST_IMAGE:sha-${GITHUB_SHA::12}" "$SOURCE_IMAGE@$digest"
          destination_digest="sha256:$(docker buildx imagetools inspect --raw "$DEST_IMAGE:sha-${GITHUB_SHA::12}" | sha256sum | cut -d' ' -f1)"
          test "$destination_digest" = "$digest" || {
            echo "Docker Hub manifest digest mismatch: expected $digest, got $destination_digest" >&2
            exit 1
          }
          cosign sign --yes "$DEST_IMAGE@$destination_digest"
          scripts/verify_container_signature.sh "$DEST_IMAGE@$destination_digest"
          for tag in "$QUREDDY_VERSION" latest; do
            docker buildx imagetools create --tag "$DEST_IMAGE:$tag" \
              "$DEST_IMAGE@$destination_digest"
            promoted_digest="sha256:$(docker buildx imagetools inspect --raw "$DEST_IMAGE:$tag" | sha256sum | cut -d' ' -f1)"
            test "$promoted_digest" = "$destination_digest"
            scripts/verify_container_signature.sh "$DEST_IMAGE:$tag"
          done
