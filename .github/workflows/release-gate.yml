name: release-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Change detection. `main` protection requires named contexts with strict: true,
  # so a workflow that never starts leaves them unreported and blocks the merge.
  # A job that starts and skips reports its context as skipped, which protection
  # accepts. The workflow always runs; the expensive jobs opt out. Any uncertainty
  # defaults to running everything.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the diff
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || {
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          changed="$(git diff --name-only "$merge_base" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(src/|tests/|scripts/|\.github/|LICENSES/|pyproject\.toml$|uv\.lock$|Dockerfile)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation-only diff; heavy jobs will skip"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  local-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Local release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run repository release gate
        run: python scripts/release_gate.py

      - name: Upload evidence and candidate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.os }}
          path: |
            dist/release-evidence/manifest.json
            dist/release-evidence/dist/*.whl
            dist/release-evidence/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90
