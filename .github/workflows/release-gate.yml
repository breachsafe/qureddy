name: release-gate

on:
  pull_request:
    paths-ignore:
      # Documentation-only changes cannot affect these gates. Every one of them
      # builds the package and runs the suite; none reads a Markdown file.
      # Safe because this repo has no required-status-check protection, so a
      # skipped workflow leaves no check pending and blocks no merge.
      - "**/*.md"
      - "docs/**"
      - "LICENSES/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    name: Local release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run repository release gate
        run: python scripts/release_gate.py

      - name: Upload evidence and candidate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.os }}
          path: |
            dist/release-evidence/manifest.json
            dist/release-evidence/dist/*.whl
            dist/release-evidence/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90
