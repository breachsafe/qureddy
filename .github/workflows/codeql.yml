# SPDX-License-Identifier: Apache-2.0
#
# GitHub-native CodeQL static analysis.
#
# CodeQL is GitHub's SAST. Free for public repos. Catches taint flows,
# dataflow issues, and language-specific security smells that ruff/bandit
# do not. Required for OpenSSF Best Practices passing tier per CODING_RULES §29.
#
# Reference: https://github.com/github/codeql-action

name: CodeQL

on:
  push:
    # Defense-in-depth (#222): scan direct-to-main commits immediately, not
    # only at the next weekly schedule. PRs are covered by the pull_request
    # trigger; this catches admin/direct pushes that bypass a PR.
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 08:00 UTC. Weekly scheduled scan even without PR activity.
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Change detection. `main` protection requires named contexts with strict: true,
  # so a workflow that never starts leaves them unreported and blocks the merge.
  # A job that starts and skips reports its context as skipped, which protection
  # accepts. The workflow always runs; the expensive jobs opt out. Any uncertainty
  # defaults to running everything.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the diff
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || {
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          changed="$(git diff --name-only "$merge_base" "$HEAD_SHA")"
          echo "$changed"
          # A deny-list, not an allow-list, so the failure direction is "run the
          # gates". An allow-list of code paths silently skips on any file it does
          # not know about: Justfile, REUSE.toml, .jscpd.json, .gitignore and
          # .python-version all change CI behaviour and none of them looks like
          # source. Only a diff where EVERY file is documentation skips.
          # LICENSES/ is deliberately absent: a licence change must still run
          # reuse lint.
          if [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Count non-documentation files rather than using `grep -vq`. On BSD grep
          # `-v -q` reports whether the PATTERN matched, not whether any line was
          # output, so a mixed docs+code diff exits 1 and would skip every gate.
          # Counting is unambiguous on both greps. `|| true` because grep exits 1
          # on a zero count and this script runs under `set -e`.
          non_doc="$(echo "$changed" | grep -cvE '(^|/)[^/]+\.md$|^docs/|^\.github/ISSUE_TEMPLATE/' || true)"
          if [ "${non_doc:-1}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation-only diff; heavy jobs will skip"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Use the security-extended queries pack for stricter coverage.
          queries: +security-extended

      - name: Set up Python 3.14
        if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        if: matrix.language == 'python'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install project from lock
        if: matrix.language == 'python'
        run: uv sync --locked --extra dev

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
