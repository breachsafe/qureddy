# SPDX-FileCopyrightText: 2026 BreachSAFE
# SPDX-License-Identifier: Apache-2.0
# Release metadata and quality-tool configuration for the TLS, SSH, and IKE
# scanner package. Keep the project table aligned with the tested wheel.

[project]
name = "breachsafe-qureddy"
version = "0.9.13"
description = "Open-source post-quantum readiness scanner for TLS, SSH, and IKE endpoints."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{name = "BreachSAFE QuReddy contributors"}]
keywords = ["pqc", "post-quantum", "cryptography", "tls", "ssh", "ike", "scanner", "cbom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]

# Runtime dependencies. click is pulled transitively by typer but
# imported directly in cli.py for the UsageError → exit-4 remap, so
# it is declared explicitly to satisfy deptry.
#
# typer upper bound (issue #186): 0.16+ vendors its own internal
# exception module instead of re-raising real click exceptions, which
# silently broke the exit-code-4 usage-error contract in cli.py. Code
# now handles this explicitly. Typer 0.27 was verified compatible: the
# full suite (521 tests), including the stdout/stderr separation tests
# from #189/#194/#30, passes against 0.27.1, so the bound is <0.28.
# Click 8.3.3 is the first release containing the fix for PYSEC-2026-2132.
#
dependencies = [
    "typer>=0.23.1,<0.28",
    "click>=8.3.3,<8.6",
    "rich>=13.7",
    "pydantic>=2.7",
    "structlog>=24.1",
    "packaging>=24.0",
    # Final bytes and independent fixtures validate the 11.x serializer
    # contract; a 12.x upgrade must deliberately refresh conformance evidence.
    "cyclonedx-python-lib>=11.11,<12",
]

[project.optional-dependencies]
# Enterprise-grade gates from day 0. See:
    # Contributor quality-gates documentation.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    # MAX code-quality + architecture gates (#360). Mirrors the tools bundled by
    # breachsafe-common's reusable quality-gates-python.yml so this repo runs the
    # same gate directly on 3.14 until it adopts `uses: ...@v1` (needs the v1 tag
    # + the pinned 3.14 container). import-linter enforces the layered contract
    # below; xenon/refurb/vulture/interrogate/diff-cover mirror the reusable gate.
    "import-linter>=2.0",
    "xenon>=0.9",
    "refurb>=2.0",
    "vulture>=2.11",
    "diff-cover>=9.0",
    "interrogate>=1.7",
    # Allure results emitted every run (--alluredir addopts below); the reusable
    # gate uploads .allure-results as an artifact.
    "allure-pytest>=2.13",
    # Property-based testing (issue #131): fuzz the untrusted-input parsers
    # (parse_target / parse_ssh_target) whose example-test blind spots shipped
    # #116/#128/#130. Deterministic in CI via a derandomized profile.
    "hypothesis>=6.100",
    # ruff upper bound: 0.16 starts format-checking Python code blocks
    # embedded in Markdown (```python fences). docs/contributors/ holds
    # intentional anti-pattern examples that must stay byte-for-byte, so
    # the markdown-format policy is set alongside this bump: `[tool.ruff.format]`
    # excludes `**/*.md` from the FORMATTER only (lint still scans everything,
    # real .py files still format-checked). 0.16.4 verified green under that
    # policy; bound is <0.17.
    "ruff>=0.15,<0.17",
    "mypy>=1.10",
    # duplicate-code (R0801): AST-level structural clone detection the token-based
    # jscpd gate misses; run disable-all/enable-duplicate-code only (#314).
    "pylint>=3.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "deptry>=0.20",
    "reuse>=4.0",
    "pre-commit>=3.5",
    "twine==6.2.0",
    # Final-byte CBOM conformance gate. jsonschema validates the vendored,
    # pinned official CycloneDX schemas; rfc3339-validator makes
    # FormatChecker enforce date-time rather than silently treating it as
    # an unknown format.
    "jsonschema>=4.25,<5",
    "rfc3339-validator>=0.1.4,<1",
    "types-jsonschema>=4.25",
    "types-rfc3339-validator>=0.1.0.20260408",
    # defusedxml is used by scripts/audit_phase.py to parse coverage.xml
    # and junit.xml safely. CODING_RULES §26 forbids stdlib xml.etree on
    # any input; defusedxml is the project-mandated alternative.
    "defusedxml>=0.7",
]
# Coverage-guided fuzzing of the untrusted-input parsers (issue #86, #37).
# Fuzz-only and optional: atheris is NOT installed by the normal dev extra
# or the release gate, and the harnesses under tests/fuzz/ (named fuzz_*.py,
# so pytest never collects them) import it behind a guard. atheris 3.1 is the
# first release with a cp314 wheel (#325); it ships manylinux_x86_64 only, so
# the fuzz gate runs on ubuntu-latest (amd64) at Python 3.14 in cifuzz.yml.
fuzz = [
    # atheris 3.1 ships manylinux_x86_64 wheels only (no sdist, no macOS/arm64),
    # so scope the requirement to where it can actually install; the fuzz gate
    # runs on ubuntu-latest (amd64).
    "atheris>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
# `qureddy.cli:main` (NOT `:app`) is the install-time entrypoint. The
# `main()` wrapper translates click.UsageError to exit code 4 per the
# documented exit-code surface (0 ok, 2 target failed, 3 local dep, 4
# usage). Pointing to `:app` directly would let Click default to exit
# 2 for usage errors, colliding with target-scan-failure.
qureddy = "qureddy.cli:main"

[project.urls]
Homepage = "https://github.com/breachsafe/qureddy"
Documentation = "https://github.com/breachsafe/qureddy/tree/main/docs"
Repository = "https://github.com/breachsafe/qureddy"
Issues = "https://github.com/breachsafe/qureddy/issues"
Changelog = "https://github.com/breachsafe/qureddy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qureddy"]

[tool.hatch.build.targets.sdist]
# Issue #159: an exclude-blocklist can only omit what it names, so every
# internal directories added later shipped into the public sdist by
# default — 51 internal files on the PyPI source view. Use an
# include-allowlist instead: the sdist ships only what a source consumer
# needs to build, install, and satisfy the license, and any new
# internal file is excluded by default rather than leaked by default.
include = [
    "/src/qureddy",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/LICENSE",
    "/LICENSES",
    "/NOTICE",
    "/REUSE.toml",
    "/pyproject.toml",
]

# ============================================================================
# ruff
# ============================================================================
[tool.ruff]
line-length = 100
# Python 3.14 is the supported runtime and formatter target.
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
# ruff 0.16 began format-checking Python code fenced in Markdown
# (```python blocks). docs/contributors/{examples,coding-rules,
# cli-design-rules}.md hold INTENTIONAL anti-pattern snippets that must
# stay byte-for-byte to illustrate the rules they violate; reformatting
# them would defeat the docs. Exclude Markdown from the FORMATTER only —
# real .py/.pyi files are still formatted and `ruff check` (lint) is
# unaffected and continues to scan everything.
exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
    "PL",   # pylint
    "PT",   # pytest style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "DTZ",  # flake8-datetimez (timezone-aware datetime)
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (no commented-out code)
    "INP",  # implicit namespace package
    "BLE",  # flake8-blind-except (catches `except Exception:` without noqa)
    "SLF",  # flake8-self (private-member access from outside the class)
    "D",    # pydocstyle — Google docstring convention per coding-rules.md Rule 5.
    # PLR0915 (too-many-statements, default max=50) is already active via
            # the PL selector and matches the Rule 2.2 function-size ceiling.
]

ignore = [
    "E501",     # line-too-long, handled by formatter
    "PLR0913",  # too-many-arguments — Typer commands legitimately have many
    "PLR0917",  # too-many-positional-arguments — same reason as PLR0913: Typer
                # command options are declared as (keyword-defaulted) parameters
    # The mvp-implement skill explicitly mandates `class Foo(str, Enum)`
    # (not `enum.StrEnum`) for the locked enums. The skill is the
    # implementation authority; UP042 would request a change that
    # violates the locked spec.
    "UP042",
    # `_LocalOpenSSLProblem` is the abstract base for the three local-
    # capability exceptions; it is private and not raised directly.
    # The mvp-implement skill convention is `*Error` suffix on the
    # public hierarchy (QureddyError, TargetParseError, RetryConfigError);
    # the private base does not need the suffix to be readable.
    "N818",
    # TC002/TC003 (move imports into TYPE_CHECKING blocks) trigger on
    # types we genuinely use at runtime: `datetime.datetime` in Pydantic
    # field declarations, `collections.abc.Callable` in retry.py
    # parameter annotations (Pydantic and runtime-introspected callbacks
    # need the symbol at module-load time), and `pytest.MonkeyPatch`
    # used as a fixture type that pytest reads at collection time.
    "TC002",
    "TC003",
    # `os.path.isfile` is the right primitive when paired with
    # `os.access(path, os.X_OK)` — both check the same os-level inode
    # state and using one Path call + one os.access call introduces a
    # TOCTOU window the current single-namespace approach avoids.
    "PTH113",
]

[tool.ruff.lint.isort]
# Rule 4.3: every Python module declares postponed annotations explicitly.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
# coding-rules.md Rule 5 mandates Google-style docstrings.
convention = "google"

[tool.ruff.lint.pylint]
# Matches coding-rules.md Rule 2.2: functions ≤ 30 lines norm, 50 ceiling.
# PLR0915 counts statements (close proxy for non-comment lines); 50 is the
# hard ceiling. Functions in the 31–50 band emit no warning here — those
# are caught at PR review per Rule 2.1.1's edge bands.
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# TC001 wants application imports used only in annotations moved into an
# `if TYPE_CHECKING:` block. Typer command modules cannot comply: Typer
# resolves the `Annotated` option aliases (cli/_options.py) at RUNTIME via
# typing.get_type_hints() to build the CLI, so hiding those imports behind
# TYPE_CHECKING raises NameError at import. Pre-ADR-0005 the aliases were
# module-local to cli.py, which is why the rule never fired before the split.
"src/qureddy/cli/main.py" = ["TC001"]
"src/qureddy/cli/scan.py" = ["TC001"]
"src/qureddy/cli/ssh.py" = ["TC001"]
"src/qureddy/cli/ike.py" = ["TC001"]
"tests/**/*.py" = [
    "S101",     # asserts allowed in tests
    "PLR2004",  # magic numbers allowed in tests
    "ARG",      # unused args allowed in fixtures
    "D",        # tests don't need Google docstrings — test names document intent,
                # and tests have no public-API surface for downstream callers.
]
"tests/fixtures/**" = ["E501"]  # fixture files may have long lines
"scripts/**/*.py" = [
    "INP001",   # scripts/ is intentionally not a package — these are
                # standalone CLIs, not modules. Adding __init__.py to
                # claim the namespace would be dishonest.
]

# ============================================================================
# pylint — duplicate-code (R0801) gate ONLY (#314)
# ============================================================================
# Every other lint is ruff's / mypy's job; pylint runs solely for AST-level clone
# detection that the token-based jscpd gate cannot see. min-similarity-lines is set
# to pass the current tree and is ratcheted DOWN as #315 de-duplication lands.
[tool.pylint."messages control"]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 12
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

# ============================================================================
# mypy
# ============================================================================
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# The release gate type-checks ``src/qureddy`` only. Keep this configuration
# free of an unused ``tests.*`` override; if test typing becomes a gate input,
# add it together with an explicit command and coverage contract.

# ============================================================================
# pytest + pytest-rerunfailures + pytest-cov
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--reruns=3",
    "--reruns-delay=1",
    # Allure results on every run (#360), consumed by the quality-gates workflow.
    "--alluredir=.allure-results",
]
# Per docs/contributors/coding-rules.md Rule 9.3: every test runs every time.
# No marker-gated suites at the pytest layer. CI may organize tests
# into multiple JOBS for fail-fast, but pytest itself runs everything.
markers = []

# ============================================================================
# import-linter — architecture contract (#360)
# ============================================================================
# Enforces the layered dependency direction verified from the import graph:
# cli -> output -> scanners -> core, and core imports nothing above it. A lower
# layer importing a higher one (e.g. core importing scanners) fails the gate.
# Run with `lint-imports`.
[tool.importlinter]
root_package = "qureddy"

[[tool.importlinter.contracts]]
name = "Layered architecture: cli > output > scanners > core"
type = "layers"
layers = [
    "qureddy.cli",
    "qureddy.output",
    "qureddy.scanners",
    "qureddy.core",
]

# ============================================================================
# coverage
# ============================================================================
[tool.coverage.run]
branch = true
source = ["qureddy"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 90
show_missing = true

# ============================================================================
# pip-audit
# ============================================================================
[tool.pip-audit]
# pip-audit 2.9 does not natively read this block; CI must pass the
# same IDs via `pip-audit --ignore-vuln <ID>` for the gate to actually
# pass. The block here is the documented record of accepted advisories.
#
# GHSA-58qw-9mgm-455v: pip's Mercurial revision argument injection.
# OSV severity: MODERATE (CVSS 4.0 AV:L/PR:N/UI:A; CWE-434 archive
# confusion). No fix released yet — pip 26.0.1 is the latest available.
# This is a vulnerability in pip itself (the package manager), not in
# qureddy or any of its runtime deps. We do not invoke pip from
# qureddy at runtime; pip is dev-tooling only. Per the quality-gate
# rules, MEDIUM and below are reported but do not block.
# Reviewed: 2026-04-26. Re-review when pip ships a fix version.
#
# PYSEC-2022-42969: ReDoS in `py.path.svnwc` regex (the `py` package).
# Severity: MEDIUM. Transitive dep chain: pip-audit → interrogate → py.
# `py` is unmaintained (frozen in 2022); the vulnerable code path is
# the SVN integration which interrogate doesn't invoke. Effective
# exploitability against qureddy or its dev tooling: zero. We do not
# touch SVN repos. Per the quality-gate rules, MEDIUM and below do
# not block. Reviewed: 2026-04-26. Re-review when interrogate drops
# the `py` dependency or when an alternative pip-audit dep tree exists.
#
# PYSEC-2026-3721: vulnerability in pip itself, fixed in pip 26.2. Like
# GHSA-58qw-9mgm-455v above, this is a vulnerability in pip (the package
# manager), not in qureddy or any of its runtime deps. pip is dev/build
# tooling and the venv-seed package manager; qureddy never invokes pip
# at runtime, and pip is not a declared runtime dependency. Upgrade path:
# the CI runtime-dependency audit upgrades the seeded pip to >=26.2, which
# actually resolves this advisory; the ID is recorded here (and passed via
# `pip-audit --ignore-vuln` in CI) so a seeded/older pip can never block a
# runtime-dependency audit on tooling-only grounds. Reviewed: 2026-08-21.
#
ignore-vulns = [
    "GHSA-58qw-9mgm-455v",
    "PYSEC-2022-42969",
    "PYSEC-2026-3721",
]

# ============================================================================
# bandit
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "scratch"]
# MEDIUM threshold: bandit fails CI on MEDIUM or HIGH findings.
# LOW findings are reported but do not block.
#
# CI must invoke `bandit -r src/qureddy scripts/` (two roots) so the
# audit script is scanned alongside production code. The skill's
# `bandit -r src/qureddy` example covers the production tree only;
# CI workflow widens the scope. Earlier the audit script shipped 3
# XXE bugs that this scoping miss let through.

# ============================================================================
# deptry
# ============================================================================
[tool.deptry]
known_first_party = ["qureddy", "release_support"]
# Distribution name (`breachsafe-qureddy`) differs from import name
# (`qureddy`); declare the mapping so deptry doesn't flag the dist as
# missing-an-import.
package_module_name_map = { "breachsafe-qureddy" = "qureddy", "cyclonedx-python-lib" = "cyclonedx" }
# `scripts/` is intentionally INCLUDED in the deptry scan so that
# imports from CI utilities (e.g. defusedxml in scripts/audit_phase.py)
# count toward dependency-usage analysis. Excluding scripts/ would
# make deptry think defusedxml is unused. `scratch/` stays excluded;
# it's gitignored agent workspace.
extend_exclude = ["scratch"]

[tool.deptry.per_rule_ignores]
# DEP002 = unused dependency. Some dev deps are CLI tools invoked by
# CI workflow, not imported by Python code. pytest, pytest-cov, and
# pytest-rerunfailures will satisfy themselves once src/ + tests/
# import them from the test suite; ruff and mypy are pure CLI tools and stay
# in this list permanently. The jsonschema/RFC3339 packages and their
# stubs are imported only by tests/conformance/, which deptry does not
# scan; they are required by the independent final-byte test gate.
# hypothesis is imported only by the property tests under tests/ (issue
# #131), which deptry likewise does not scan, so it is listed here too.
# atheris (fuzz optional group, issue #86) is imported only by the harnesses
# under tests/fuzz/, which deptry does not scan, so it is listed here as well.
DEP002 = [
    "bandit",
    "pip-audit",
    "deptry",
    "pre-commit",
    "reuse",
    "ruff",
    "mypy",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures",
    "twine",
    "jsonschema",
    "rfc3339-validator",
    "types-jsonschema",
    "types-rfc3339-validator",
    "hypothesis",
    "atheris",
    # MAX-gate CLI tools (#360): invoked as commands by quality-gates.yml, not
    # imported. allure-pytest is a pytest plugin loaded via the --alluredir
    # addopt, so it is never imported by name either.
    "import-linter",
    "xenon",
    "refurb",
    "vulture",
    "diff-cover",
    "interrogate",
    "allure-pytest",
]
